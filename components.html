<!-- ================================
     SITE PIN LOCK
================================ -->

<div id="site-pin-lock" class="site-pin-lock" role="dialog" aria-modal="true" aria-labelledby="site-pin-title">

    <div class="site-pin-box">

        <div class="site-pin-icon">
            <img src="assets/logo.png" alt="Çandarli">
        </div>

        <div class="site-pin-heading">

            <h1 id="site-pin-title">
                Welcome back
            </h1>

            <p>
                Enter your PIN to open Çandarli.
            </p>

        </div>

        <form id="site-pin-form">

            <label for="site-pin-input" class="sr-only">
                PIN
            </label>

            <input id="site-pin-input" type="password" inputmode="numeric" autocomplete="off" maxlength="20"
                placeholder="Enter PIN" aria-label="Site PIN" aria-describedby="site-pin-error" required>

            <button id="site-pin-submit" type="submit">
                Unlock
            </button>

        </form>

        <p id="site-pin-error" class="site-pin-error" aria-live="polite"></p>

    </div>

</div>

</div>
