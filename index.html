<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="icon" type="image/x-icon" href="assets/favicon/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png">

<body data-page="home">

    <div id="navbar"></div>

    <main class="main home-main">
        <div class="page-container">

            <section class="os-header">
                <div>
                    <h1 id="home-greeting">Welcome back.</h1>
                    <p class="os-subtitle">
                        Your personal space, all in one place.
                    </p>
                </div>

                <div class="os-date" id="os-date"></div>
            </section>

            <section class="os-dashboard">

                <!-- FURNACE -->
                <a href="journal.html" class="widget widget-furnace">

                    <div class="widget-furnace-header">
                        <div class="widget-furnace-title">
                            <div class="widget-furnace-icon">
                                <img src="assets/icons/coal.png" alt="Coal">
                            </div>

                            <div>
                                <h2>Furnace</h2>

                            </div>

                        <div class="furnace-streak">

                        </div>
                    </div>

                    <div class="widget-furnace-footer">
                        <span>Devam et.</span>
