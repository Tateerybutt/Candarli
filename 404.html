<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Çandarli — Page Not Found</title>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

  <!-- Existing Global CSS -->
  <link rel="stylesheet" href="./css/style.css">

  <style>
    /* ========================================
           404 PAGE
        ======================================== */

    .error-page {
      min-height: calc(100vh - 140px);

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 40px 20px;
    }

    .error-container {
      width: 100%;
      max-width: 520px;

      text-align: center;
    }

    .error-code {
      margin: 0;

      color: var(--navy);

      font-size: clamp(90px, 18vw, 160px);
      font-weight: 700;
      line-height: 1;

      letter-spacing: -8px;
    }

    .error-title {
      margin: 20px 0 10px;

      color: var(--text);

      font-size: 28px;
      font-weight: 700;
    }

    .error-message {
      max-width: 420px;

      margin: 0 auto 28px;

      color: var(--text-muted);

      font-size: 15px;
      line-height: 1.7;
    }

    .error-actions {
      display: flex;
      justify-content: center;
      gap: 12px;

      flex-wrap: wrap;
    }

    .error-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;

      padding: 12px 20px;

      border-radius: 10px;

      font-family: inherit;
      font-size: 14px;
      font-weight: 600;

      text-decoration: none;

      cursor: pointer;

      transition:
        background 0.2s ease,
        color 0.2s ease,
        border-color 0.2s ease,
        transform 0.2s ease;
    }

    .error-button:hover {
      transform: translateY(-1px);
    }

    .error-button-primary {
      background: var(--blue-dark);
      color: var(--surface);

      border: 1px solid var(--blue-dark);
    }

    .error-button-primary:hover {
      background: var(--blue);
      border-color: var(--blue);
    }

    .error-button-secondary {
      background: var(--surface);
      color: var(--text);

      border: 1px solid var(--border);
    }

    .error-button-secondary:hover {
      background: var(--background);
      border-color: var(--border);
    }

    @media (max-width: 600px) {

      .error-page {
        min-height: calc(100vh - 100px);
        padding: 30px 16px;
      }

      .error-code {
        letter-spacing: -5px;
      }

      .error-title {
        font-size: 24px;
      }

      .error-message {
        font-size: 14px;
      }

      .error-actions {
        flex-direction: column;
        width: 100%;
        max-width: 280px;
        margin: 0 auto;
      }

      .error-button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <!-- ================================
         NAVBAR
    ================================= -->

  <div id="navbar"></div>


  <!-- ================================
         404 CONTENT
    ================================= -->

  <main class="error-page">

    <div class="error-container">

      <p class="error-code">404</p>

      <h1 class="error-title">
        Page Not Found
      </h1>

      <p class="error-message">
        Looks like this page wandered off somewhere.
        It may have been moved, deleted, or never existed
        in the first place.
      </p>

      <div class="error-actions">

        <a href=".//" class="error-button error-button-primary">
          <i class="fa-solid fa-house"></i>
          Go Home
        </a>

        <a href="javascript:history.back()" class="error-button error-button-secondary">
          <i class="fa-solid fa-arrow-left"></i>
          Go Back
        </a>

      </div>

    </div>

  </main>


  <!-- ================================
         FOOTER
    ================================= -->

  <div id="footer"></div>


  <!-- ================================
         COMPONENTS
    ================================= -->

  <script type="module" src="./js/component.js"></script>

</body>

</html>
